name: CI pineline

on: 
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-lastest

    steps:
      - name: checkout code
        uses: actions/checkout@y5

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Run test
        run: npm test